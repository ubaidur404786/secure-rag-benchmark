<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .name  { font-size: 14px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
      .sub   { font-size: 11.5px; fill: #475569; text-anchor: middle; }
      .tag   { font-size: 10.5px; font-weight: 700; fill: #1d4ed8; text-anchor: middle; }
      .line  { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .fall  { stroke: #b45309; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#r); }
    </style>
  </defs>

  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="40" y="44" class="title">LLM gateway (LiteLLM): one secure, reliable door to every model</text>

  <!-- apps -->
  <rect x="40" y="90" width="150" height="56" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="115" y="114" class="name">RAG assistant</text>
  <text x="115" y="132" class="sub">rag_core / secure_rag</text>
  <rect x="40" y="166" width="150" height="56" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="115" y="190" class="name">Agent / chatbot</text>
  <text x="115" y="208" class="sub">any other app</text>
  <rect x="40" y="242" width="150" height="56" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="115" y="266" class="name">Internal tools</text>
  <text x="115" y="284" class="sub">scripts, notebooks</text>

  <path d="M190 118 H246" class="line"/>
  <path d="M190 194 H246" class="line"/>
  <path d="M190 270 H246" class="line"/>

  <!-- gateway -->
  <rect x="250" y="74" width="440" height="244" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="470" y="100" class="name" font-size="15">gateway.py</text>

  <rect x="270" y="116" width="190" height="84" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="365" y="136" class="tag">SECURITY</text>
  <text x="365" y="157" class="name">Central guardrails</text>
  <text x="365" y="176" class="sub">input + output checks,</text>
  <text x="365" y="191" class="sub">same rules for every app</text>

  <rect x="480" y="116" width="190" height="84" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="575" y="136" class="tag">SPEED · COST</text>
  <text x="575" y="157" class="name">Cache</text>
  <text x="575" y="176" class="sub">same prompt → instant,</text>
  <text x="575" y="191" class="sub">no model call</text>

  <rect x="270" y="216" width="190" height="84" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="365" y="236" class="tag">RELIABILITY</text>
  <text x="365" y="257" class="name">Router</text>
  <text x="365" y="276" class="sub">timeout · fallback ·</text>
  <text x="365" y="291" class="sub">cooldown of broken models</text>

  <rect x="480" y="216" width="190" height="84" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="575" y="236" class="tag">OBSERVABILITY</text>
  <text x="575" y="257" class="name">Call log</text>
  <text x="575" y="276" class="sub">model used, latency,</text>
  <text x="575" y="291" class="sub">cost ($0 local), blocked</text>

  <!-- models -->
  <rect x="770" y="90" width="190" height="56" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="865" y="114" class="name">qwen2.5:7b</text>
  <text x="865" y="132" class="sub">primary</text>
  <rect x="770" y="166" width="190" height="56" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="865" y="190" class="name">gemma2:2b</text>
  <text x="865" y="208" class="sub">backup 1</text>
  <rect x="770" y="242" width="190" height="56" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="865" y="266" class="name">llama3.2:1b</text>
  <text x="865" y="284" class="sub">backup 2</text>

  <path d="M690 118 H766" class="line"/>
  <path d="M865 146 V162" class="fall"/>
  <path d="M865 222 V238" class="fall"/>
  <text x="700" y="160" font-size="11.5" fill="#b45309">down, busy</text>
  <text x="700" y="175" font-size="11.5" fill="#b45309">or too slow?</text>
  <text x="700" y="190" font-size="11.5" fill="#b45309">→ backup</text>

  <!-- footer -->
  <rect x="40" y="342" width="920" height="102" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="370" font-size="13" font-weight="700" fill="#0f172a">Why a gateway?</text>
  <text x="60" y="394" font-size="12.5" fill="#334155">• Reliability: when the main model fails, users still get an answer from a backup instead of an error.</text>
  <text x="60" y="414" font-size="12.5" fill="#334155">• Security: guardrails live in one place, so even an app with no security of its own is protected.</text>
  <text x="60" y="434" font-size="12.5" fill="#334155">• Swap providers (local ↔ cloud) by changing one list, with no change to the apps.</text>
</svg>
